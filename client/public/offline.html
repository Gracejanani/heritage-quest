<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064e3b" />
    <title>Heritage Quest — Offline</title>
    <style>
      :root {
        color: #24352f;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fffaf0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        padding: 32px 24px;
        border: 1px solid #d9eee5;
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(6 78 59 / 12%);
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
      }

      h1 {
        margin: 18px 0 8px;
        color: #064e3b;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: #64748b;
        line-height: 1.6;
      }

      button {
        width: 100%;
        margin-top: 24px;
        padding: 13px 18px;
        border: 0;
        border-radius: 16px;
        background: #078761;
        color: white;
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/heritage-quest-logo.svg" alt="Heritage Quest" />
      <h1>You are offline</h1>
      <p>Connect to Wi-Fi or mobile data, then try opening Heritage Quest again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
